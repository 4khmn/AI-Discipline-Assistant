spring.application.name=habit-api-service
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/habit_db
spring.datasource.username=habit_user
spring.datasource.password=habit_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=habit-api-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.jwt.secret=${JWT_SECRET:myVeryLongAndSecureSecretKeyForJwtAuthenticationWhichIsAtLeast32BytesLong}
app.jwt.expiration=86400000

logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=INFO
