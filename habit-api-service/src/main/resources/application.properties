spring.application.name=habit-api-service
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/habit_db
spring.datasource.username=habit_user
spring.datasource.password=habit_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=habit-api-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

app.jwt.secret=${JWT_SECRET:myVeryLongAndSecureSecretKeyForJwtAuthenticationWhichIsAtLeast32BytesLong}
app.jwt.expiration=86400000

logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.structured.format.console=logstash

management.endpoints.web.exposure.include=health,metrics,prometheus

# Разрешаем доступ к endpoint-у проверки состояния приложения
management.endpoint.health.access=unrestricted

# Разрешаем доступ к endpoint-у с метриками Prometheus
management.endpoint.prometheus.access=unrestricted
