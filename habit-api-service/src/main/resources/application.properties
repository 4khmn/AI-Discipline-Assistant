spring.application.name=habit-api-service
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/habit_db
spring.datasource.username=habit_user
spring.datasource.password=habit_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=habit-api-group
spring.kafka.consumer.auto-offset-reset=earliest
