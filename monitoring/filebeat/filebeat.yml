
filebeat.inputs:
  - type: filestream
    id: docker-logs
    paths:
      - /var/lib/docker/containers/*/*-json.log
    parsers:
      - container:
          format: docker



processors:
  - add_docker_metadata:
      host: "unix:///var/run/docker.sock"

  - decode_json_fields:
      fields: ["message"]
      target: ""
      overwrite_keys: true
      add_error_key: true



output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "habit-logs-%{+yyyy.MM.dd}"

setup.ilm.enabled: false
setup.template.name: "habit-logs"
setup.template.pattern: "habit-logs-*"
