spring.application.name=ai-analytics-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/habit_db
spring.datasource.username=habit_user
spring.datasource.password=habit_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ai-analytics-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
