databaseChangeLog:
  - changeSet:
      id: 1
      author: system
      changes:
        - createTable:
            tableName: habit_recommendations
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: habit_id
                  type: BIGINT
              - column:
                  name: user_input
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: recommendation_text
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: ai_response_duration_ms
                  type: BIGINT
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
